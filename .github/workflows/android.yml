name: Android APK (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
      NDK_VERSION: 27.2.12479018
      NDK_HOME: /home/runner/android-sdk/ndk/27.2.12479018
      CARGO_BUILD_JOBS: "8"
      AXOLOTL_SKIP_BLOCKBENCH_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install Android SDK (command line only)
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > apps/app/gen/android/local.properties
          echo "ndk.dir=$NDK_HOME" >> apps/app/gen/android/local.properties

      - name: Install Rust
        run: |
          set -euxo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android
          rustc --version

      - name: Install Node / pnpm
        run: |
          set -euxo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y -qq nodejs
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          node --version && pnpm --version

      - name: Prepare resources
        run: |
          # blockbench 子模块很大，用占位页跳过；tauri.conf 需要该目录存在
          mkdir -p apps/app/resources/blockbench-skin
          if [ ! -f apps/app/resources/blockbench-skin/index.html ]; then
            printf '<!doctype html><meta charset=utf-8><title>Blockbench</title><p>Blockbench skin editor is not bundled in this build.' \
              > apps/app/resources/blockbench-skin/index.html
          fi
          mkdir -p apps/app/gen/android/app/src/main/jniLibs/arm64-v8a

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Build Rust cdylib
        run: |
          set -euxo pipefail
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          cargo build -p theseus_gui --lib --release --target aarch64-linux-android
          JNI=apps/app/gen/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libtheseus_gui_lib.so "$JNI/"
          "$TOOLCHAIN/bin/llvm-strip" --strip-unneeded "$JNI/libtheseus_gui_lib.so"
          ls -lh "$JNI"

      - name: Gradle assemble
        working-directory: apps/app/gen/android
        run: |
          chmod +x gradlew
          ./gradlew app:assembleArm64Debug \
            -x rustBuildArm64Debug -x rustBuildUniversalDebug \
            --console=plain --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: axolotl-arm64-debug
          path: apps/app/gen/android/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
