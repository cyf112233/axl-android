name: Android APK (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
      NDK_VERSION: 27.2.12479018
      NDK_HOME: /home/runner/android-sdk/ndk/27.2.12479018
      CARGO_BUILD_JOBS: "8"
      AXOLOTL_SKIP_BLOCKBENCH_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install Android SDK (command line only)
        run: |
          set -x
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL --http1.1 --retry 5 --retry-delay 3 -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          curl_rc=$?
          if [ $curl_rc -ne 0 ]; then
            echo "::error title=curl-sdk::$curl_rc"
            exit 1
          fi
          unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +e
          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /tmp/lic.log 2>&1
          echo "licenses rc=$?"
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --version
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" \
            > /tmp/sdkm.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=sdkmanager-rc-$rc::$rc"
            python3 - <<'EOF'
          import os
          log = open('/tmp/sdkm.log', errors='replace').read()[-2500:]
          esc = log.replace('%','%25').replace('\r','').replace('\n','%0A')
          print('::error title=sdkmanager-log::' + esc)
          EOF
            tail -40 /tmp/sdkm.log
            exit $rc
          fi
          set -e
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > apps/app/gen/android/local.properties
          echo "ndk.dir=$NDK_HOME" >> apps/app/gen/android/local.properties

      - name: Install Rust
        run: |
          set -euxo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android
          rustc --version

      - name: Install Node / pnpm
        run: |
          set -euxo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y -qq nodejs
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          node --version && pnpm --version

      - name: Prepare resources
        run: |
          # blockbench 子模块很大，用占位页跳过；tauri.conf 需要该目录存在
          mkdir -p apps/app/resources/blockbench-skin
          if [ ! -f apps/app/resources/blockbench-skin/index.html ]; then
            printf '<!doctype html><meta charset=utf-8><title>Blockbench</title><p>Blockbench skin editor is not bundled in this build.' \
              > apps/app/resources/blockbench-skin/index.html
          fi
          mkdir -p apps/app/gen/android/app/src/main/jniLibs/arm64-v8a

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Build Rust cdylib
        run: |
          set -euxo pipefail
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          cargo build -p theseus_gui --lib --release --target aarch64-linux-android
          JNI=apps/app/gen/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libtheseus_gui_lib.so "$JNI/"
          "$TOOLCHAIN/bin/llvm-strip" --strip-unneeded "$JNI/libtheseus_gui_lib.so"
          ls -lh "$JNI"

      - name: Tauri android init (settings file)
        working-directory: apps/app
        run: |
          # gen/android/tauri.settings.gradle 里是 cargo registry 的绝对路径，不能提交，
          # 必须在 cargo 依赖解包之后由 CLI 生成。
          pnpm exec tauri android init --ci --skip-targets-install
          echo "--- tauri.settings.gradle ---"
          cat gen/android/tauri.settings.gradle
          echo "sdk.dir=$ANDROID_SDK_ROOT" > gen/android/local.properties
          echo "ndk.dir=$NDK_HOME" >> gen/android/local.properties

      - name: Gradle assemble
        working-directory: apps/app/gen/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew app:assembleArm64Debug \
            -x rustBuildArm64Debug -x rustBuildUniversalDebug \
            --console=plain --no-daemon --stacktrace > /tmp/gradle.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            python3 - <<'EOF'
          log = open('/tmp/gradle.log', errors='replace').read()[-4000:]
          print('::error title=gradle-log::' + log.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          EOF
            echo "--- tail ---"
            tail -60 /tmp/gradle.log
            exit $rc
          fi
          tail -20 /tmp/gradle.log

      - name: Publish failure log
        if: failure()
        run: |
          set -x
          cp /tmp/gradle.log ci-gradle-failure.log 2>/dev/null || true
          cp /tmp/sdkm.log ci-sdkmanager.log 2>/dev/null || true
          ls -la ci-*.log 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b "ci-log-${{ github.run_id }}"
          git add -f ci-gradle-failure.log ci-sdkmanager.log 2>/dev/null || true
          git commit -m "ci: failure log for run ${{ github.run_id }}" || true
          git push origin "ci-log-${{ github.run_id }}" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: axolotl-arm64-debug
          path: apps/app/gen/android/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
